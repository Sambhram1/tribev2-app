<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIBE v2 — Brain Encoding Inference</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
  .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 36px; width: 100%; max-width: 560px; }
  h1 { font-size: 1.3rem; color: #a78bfa; margin-bottom: 4px; letter-spacing: 0.05em; }
  .sub { font-size: 0.75rem; color: #555; margin-bottom: 28px; }
  label { font-size: 0.8rem; color: #888; display: block; margin-bottom: 6px; }
  input[type=file] { display: none; }
  .file-btn { display: block; width: 100%; padding: 12px; background: #1e1e1e; border: 1px dashed #3a3a3a; border-radius: 6px; text-align: center; cursor: pointer; font-family: inherit; font-size: 0.85rem; color: #aaa; transition: border-color 0.2s; }
  .file-btn:hover { border-color: #a78bfa; color: #fff; }
  #filename { font-size: 0.75rem; color: #666; margin-top: 6px; min-height: 16px; }
  button { width: 100%; margin-top: 20px; padding: 12px; background: #7c3aed; border: none; border-radius: 6px; color: #fff; font-family: inherit; font-size: 0.9rem; cursor: pointer; transition: background 0.2s; }
  button:hover:not(:disabled) { background: #6d28d9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #status { margin-top: 20px; font-size: 0.78rem; color: #666; min-height: 20px; white-space: pre-wrap; }
  .result { margin-top: 20px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; padding: 16px; display: none; }
  .result h2 { font-size: 0.8rem; color: #a78bfa; margin-bottom: 10px; }
  .result p { font-size: 0.78rem; color: #aaa; margin-bottom: 6px; }
  .result .val { color: #e0e0e0; }
  .dl-btn { display: inline-block; margin-top: 12px; padding: 8px 18px; background: #1d4ed8; border-radius: 5px; color: #fff; text-decoration: none; font-size: 0.8rem; }
  .dl-btn:hover { background: #1e40af; }
  .err { color: #f87171; }
</style>
</head>
<body>
<div class="card">
  <h1>TRIBE v2</h1>
  <p class="sub">Meta Brain Encoding Model — Video → Neural Activations</p>

  <label>Select video file</label>
  <label class="file-btn" for="videoInput" id="dropLabel">Click to choose video (.mp4 .avi .mov)</label>
  <input type="file" id="videoInput" accept=".mp4,.avi,.mov">
  <div id="filename"></div>

  <button id="runBtn" disabled>Run Inference</button>

  <div id="status"></div>

  <div class="result" id="result">
    <h2>Prediction Output</h2>
    <p>Shape: <span class="val" id="resShape"></span></p>
    <p>Preview (first 5 values): <span class="val" id="resPreview"></span></p>
    <a class="dl-btn" id="dlLink" href="#" download="brain_predictions.npy">Download .npy</a>
  </div>
</div>

<script>
const input = document.getElementById('videoInput');
const runBtn = document.getElementById('runBtn');
const status = document.getElementById('status');
const result = document.getElementById('result');
const filename = document.getElementById('filename');

input.addEventListener('change', () => {
  if (input.files[0]) {
    filename.textContent = input.files[0].name;
    runBtn.disabled = false;
  }
});

runBtn.addEventListener('click', async () => {
  const file = input.files[0];
  if (!file) return;

  runBtn.disabled = true;
  result.style.display = 'none';
  status.className = '';
  status.textContent = 'Uploading…';

  const form = new FormData();
  form.append('video', file);

  try {
    status.textContent = 'Uploading…';
    const res = await fetch('/predict', { method: 'POST', body: form });

    status.textContent = 'Running TRIBE v2…';
    const data = await res.json();

    if (!res.ok) {
      status.className = 'err';
      status.textContent = 'Error: ' + (data.detail || res.statusText);
      return;
    }

    status.textContent = 'Done!';
    document.getElementById('resShape').textContent = JSON.stringify(data.shape);
    document.getElementById('resPreview').textContent = JSON.stringify(data.preview);
    document.getElementById('dlLink').href = data.download_url;
    result.style.display = 'block';
  } catch (e) {
    status.className = 'err';
    status.textContent = 'Network error: ' + e.message;
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
